[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoloflow"
version = "0.1.0"
description = "Production-ready YOLO training pipeline for custom datasets"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Team", email = "your.email@example.com"}
]
keywords = [
    "yolo",
    "computer-vision",
    "deep-learning",
    "object-detection",
    "training-pipeline",
    "mlops"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "ultralytics>=8.0.0",
    "comet-ml>=3.0.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
cloud = [
    # Future: Add cloud provider SDKs
    # "azure-ml-sdk>=1.0.0",
    # "google-cloud-aiplatform>=1.0.0",
    # "sagemaker>=2.0.0",
]
all = [
    "yoloflow[dev,cloud]",
]

[project.urls]
Homepage = "https://github.com/yourusername/yoloflow"
Documentation = "https://github.com/yourusername/yoloflow/docs"
Repository = "https://github.com/yourusername/yoloflow"
Issues = "https://github.com/yourusername/yoloflow/issues"

[project.scripts]
yoloflow = "yoloflow.cli.main:main"

[tool.setuptools]
packages = ["yoloflow"]

[tool.setuptools.package-data]
yoloflow = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=yoloflow --cov-report=term-missing --cov-report=html"
