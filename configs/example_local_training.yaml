# Example YoloFlow Configuration for Local Training
# This is a complete configuration template with all available options

model:
  name: yolo26n.pt          # Model architecture or pretrained weights path
  pretrained: true           # Use pretrained weights
  dropout: 0.0              # Dropout rate

dataset:
  path: dataset.yaml  # Path to dataset YAML
  imgsz: 640                # Input image size
  cache: "False"            # Cache images: "False", "True", "disk", or "ram"
  fraction: 1.0             # Dataset fraction to use (0.0 to 1.0)

hyperparameters:
  epochs: 100               # Number of training epochs
  batch: 16                 # Batch size
  workers: 4                # Number of dataloader workers
  device: "0"               # Device: "0" for GPU 0, "cpu" for CPU, "0,1,2,3" for multi-GPU
  patience: 100             # Early stopping patience (epochs)
  save_period: -1           # Save checkpoint every N epochs (-1 to disable)
  close_mosaic: 10          # Disable mosaic augmentation for final N epochs
  amp: true                 # Automatic Mixed Precision training
  seed: 0                   # Random seed for reproducibility

optimizer:
  optimizer: auto           # Optimizer: "SGD", "Adam", "AdamW", "NAdam", "RAdam", "RMSProp", "auto"
  lr0: 0.01                 # Initial learning rate
  lrf: 0.01                 # Final learning rate factor (final_lr = lr0 * lrf)
  momentum: 0.937           # SGD momentum / Adam beta1
  weight_decay: 0.0005      # Optimizer weight decay

augmentation:
  # HSV augmentation
  hsv_h: 0.015              # HSV-Hue augmentation (fraction)
  hsv_s: 0.7                # HSV-Saturation augmentation (fraction)
  hsv_v: 0.4                # HSV-Value augmentation (fraction)

  # Geometric augmentation
  degrees: 0.0              # Image rotation (+/- degrees)
  translate: 0.1            # Image translation (+/- fraction)
  scale: 0.5                # Image scale (+/- gain)
  shear: 0.0                # Image shear (+/- degrees)
  perspective: 0.0          # Image perspective (+/- fraction)

  # Flip augmentation
  flipud: 0.0               # Image flip up-down (probability)
  fliplr: 0.5               # Image flip left-right (probability)

  # Advanced augmentation
  mosaic: 1.0               # Mosaic augmentation (probability)
  mixup: 0.0                # MixUp augmentation (probability)
  copy_paste: 0.0           # Copy-paste augmentation (probability)

experiment:
  project: runs/train                    # Project directory for saving results
  name: experiment_name_01            # Experiment name
  exist_ok: false                        # Overwrite existing experiment directory
  resume: null                          # Resume from checkpoint path (null to disable)
  verbose: true                         # Verbose logging
  val: true                             # Validate during training
  save: true                            # Save checkpoints
  plots: true                           # Generate training plots

  # Comet ML configuration (optional)
  comet_api_key: null                   # Comet ML API key (or use COMET_API_KEY env var)
  comet_project: null                   # Comet ML project name
  comet_workspace: null                 # Comet ML workspace name
  comet_experiment_name: null           # Comet ML experiment name
  comet_experiment_tag: null            # Comet ML experiment tag
